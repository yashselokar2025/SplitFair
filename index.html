<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplitFair — Tip & Bill Splitter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Global Hack Week · Hacktoberfest</p>
          <h1>SplitFair</h1>
          <p class="lede">A tiny tip calculator that splits the bill fairly, live as you type.</p>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false">
          Dark mode
        </button>
      </header>

      <section class="card" aria-labelledby="bill-heading">
        <h2 id="bill-heading">Bill details</h2>

        <label class="field">
          <span>Bill amount</span>
          <div class="input-wrap">
            <span class="prefix" aria-hidden="true">$</span>
            <input
              id="bill"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
              placeholder="0.00"
              value="86.40"
            />
          </div>
        </label>

        <fieldset class="tip-group">
          <legend>Tip percent</legend>
          <div class="chips" id="tipChips">
            <button type="button" class="chip" data-tip="10">10%</button>
            <button type="button" class="chip is-active" data-tip="15">15%</button>
            <button type="button" class="chip" data-tip="18">18%</button>
            <button type="button" class="chip" data-tip="20">20%</button>
            <button type="button" class="chip" data-tip="25">25%</button>
          </div>
          <label class="field compact">
            <span>Custom tip %</span>
            <input id="customTip" type="number" min="0" max="100" step="0.5" placeholder="e.g. 12" />
          </label>
        </fieldset>

        <label class="field">
          <span>People splitting</span>
          <div class="stepper">
            <button type="button" id="minusPeople" aria-label="Fewer people">−</button>
            <input id="people" type="number" min="1" step="1" value="3" />
            <button type="button" id="plusPeople" aria-label="More people">+</button>
          </div>
        </label>
      </section>

      <section class="results" aria-live="polite">
        <article>
          <p>Tip</p>
          <strong id="tipAmount">$0.00</strong>
        </article>
        <article>
          <p>Total</p>
          <strong id="totalAmount">$0.00</strong>
        </article>
        <article class="highlight">
          <p>Each person pays</p>
          <strong id="perPerson">$0.00</strong>
        </article>
      </section>

      <p class="hint" id="status">Totals update instantly when you change the bill, tip, or group size.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
